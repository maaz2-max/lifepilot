<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#c7c8f4" />
    <meta name="description" content="LifePilot personal assistant, calendar, tasks, notes, reminders, and money tracker." />
    <link id="app-manifest" rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <script>
      (function() {
        if (window.location.pathname.startsWith('/project/')) {
          var manifest = {
            name: "Shared Room - LifePilot",
            short_name: "Room",
            start_url: window.location.pathname,
            display: "standalone",
            background_color: "#c7c8f4",
            theme_color: "#c7c8f4",
            icons: [{ src: "/icons/icon.svg", sizes: "any", type: "image/svg+xml", purpose: "any maskable" }]
          };
          var blob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
          document.getElementById('app-manifest').href = URL.createObjectURL(blob);
        }
      })();
    </script>
    <title>LifePilot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
